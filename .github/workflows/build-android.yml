name: Build offline atlas APK
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore automatic fallback signing keystore cache
        uses: actions/cache@v4
        with:
          path: ~/.atlas-keystore
          key: atlas-auto-keystore-v1-${{ github.run_number }}
          restore-keys: |
            atlas-auto-keystore-v1-
            atlas-auto-keystore-v1

      - name: Install Hugo and the pinned Android platform
        shell: bash
        run: |
          set -euo pipefail
          v=0.131.0; pkg="hugo_${v}_linux-amd64.tar.gz"; base="https://github.com/gohugoio/hugo/releases/download/v${v}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$pkg"; curl -fsSLO "$base/hugo_${v}_checksums.txt"
          grep -F " $pkg" "hugo_${v}_checksums.txt" | sha256sum -c -
          mkdir -p atlas-tools; tar xzf "$pkg" -C atlas-tools hugo; echo "$RUNNER_TEMP/atlas-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Check the Markdown catalogs, offline acres and walking rig
        run: |
          node Hugo-Project/tools/check-content.mjs --tiles
          node Hugo-Project/tools/check-villages.mjs
          node Hugo-Project/tools/check-growth.mjs
          node Hugo-Project/tools/check-homes.mjs
          node Hugo-Project/tools/check-motion.mjs
          node Hugo-Project/tools/check-stones.mjs
          node Hugo-Project/tools/check-swim.mjs
          node Hugo-Project/tools/check-river-margin.mjs
          node Hugo-Project/tools/check-banks.mjs
          node Hugo-Project/tools/check-current-pages.mjs
          node Hugo-Project/tools/check-stages.mjs
          node Hugo-Project/tools/check-jump-cycle.mjs
          node Hugo-Project/tools/check-rain-state.mjs
          node Hugo-Project/tools/check-runoff.mjs
          node Hugo-Project/tools/check-water.mjs
          node Hugo-Project/tools/check-littoral.mjs
          node Hugo-Project/tools/check-scene-contact.mjs

      - name: Plan version and detect engine vs. content changes
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prev"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "app-version.json" --dir "$RUNNER_TEMP/prev" --clobber || true
          python3 android/release_meta.py plan \
            --prev "$RUNNER_TEMP/prev/app-version.json" \
            --run-number "${GITHUB_RUN_NUMBER:-1}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Render fresh Markdown, compile, sign and verify APK
        shell: bash
        env:
          SIGNING_KEY_B64: ${{ secrets.ATLAS_KEYSTORE_B64 }}
          SECRET_SIGN_PASS: ${{ secrets.ATLAS_SIGN_PASS }}
          SIGNING_ALIAS: ${{ vars.ATLAS_KEY_ALIAS }}
        run: |
          set -euo pipefail; umask 077
          if [ -n "$SIGNING_KEY_B64" ] && [ -n "$SECRET_SIGN_PASS" ]; then
            key="$RUNNER_TEMP/atlas-signing.p12"
            trap 'rm -f "$key"' EXIT
            printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$key"
            export ATLAS_SIGN_PASS="$SECRET_SIGN_PASS"
            alias_name="${SIGNING_ALIAS:-atlas-field}"
          else
            echo "::notice::ATLAS_KEYSTORE_B64 / ATLAS_SIGN_PASS not set; using cached persistent signing keystore."
            mkdir -p "$HOME/.atlas-keystore"
            key="$HOME/.atlas-keystore/auto-signing.p12"
            pass_file="$HOME/.atlas-keystore/auto-signing.pass"
            alias_name="atlas-field"
            if [ ! -s "$key" ] || [ ! -s "$pass_file" ]; then
              python3 -c "import secrets; print(secrets.token_hex(24))" > "$pass_file"
              auto_pass="$(cat "$pass_file")"
              keytool -genkeypair -v \
                -storetype PKCS12 \
                -keystore "$key" \
                -alias "$alias_name" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass "$auto_pass" \
                -keypass "$auto_pass" \
                -dname "CN=Telugu States Atlas, OU=Field Atlas, O=CSRGO, C=IN"
            fi
            export ATLAS_SIGN_PASS="$(cat "$pass_file")"
          fi

          python3 android/build_apk.py \
            --site Hugo-Project \
            --keystore "$key" \
            --alias "$alias_name" \
            --version-code "${{ steps.plan.outputs.version_code }}" \
            --version-name "${{ steps.plan.outputs.version_name }}" \
            --meta-out "$RUNNER_TEMP/app-version.json" \
            --out "$RUNNER_TEMP/Telugu-States-Atlas.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Telugu-States-Atlas-APK
          path: |
            ${{ runner.temp }}/Telugu-States-Atlas.apk
            ${{ runner.temp }}/app-version.json
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Publish latest APK and release metadata to GitHub Releases
        if: github.event_name != 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.plan.outputs.version_name }}
          VERSION_CODE: ${{ steps.plan.outputs.version_code }}
          CHANGE_KIND: ${{ steps.plan.outputs.change_kind }}
          ENGINE_HASH: ${{ steps.plan.outputs.engine_hash }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          if [ "$CHANGE_KIND" = "engine" ]; then
            summary="Engine / functionality / animation / 3D model update — installed apps will show **Update available**."
          else
            summary="Content refresh — already-installed apps sync updated content live without requiring an APK update."
          fi
          notes="$(printf '%s\n\n- Version: `%s` (`versionCode=%s`)\n- Engine SHA-256: `%s`\n- Commit: `%s`\n' "$summary" "$VERSION_NAME" "$VERSION_CODE" "$ENGINE_HASH" "$GITHUB_SHA")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$RUNNER_TEMP/Telugu-States-Atlas.apk" \
              "$RUNNER_TEMP/app-version.json" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Telugu States Android v${VERSION_NAME}" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" \
              "$RUNNER_TEMP/Telugu-States-Atlas.apk" \
              "$RUNNER_TEMP/app-version.json" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Telugu States Android v${VERSION_NAME}" \
              --notes "$notes" \
              --latest
          fi
