[build]
  base = "Hugo-Project"
  command = "hugo --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.131.0"

[[redirects]]
  from = "/Telugu-States-Atlas.apk"
  to = "https://github.com/srikanth1815101/telugustates/releases/latest/download/Telugu-States-Atlas.apk"
  status = 302
  force = true

[[redirects]]
  from = "/download/Telugu-States-Atlas.apk"
  to = "https://github.com/srikanth1815101/telugustates/releases/latest/download/Telugu-States-Atlas.apk"
  status = 302
  force = true

[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/catalog.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"
